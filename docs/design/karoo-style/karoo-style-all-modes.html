<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karoo style, all five watts options</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>:root{--font-sans:system-ui,-apple-system,"Segoe UI",sans-serif;--text-secondary:#5F5E5A;--surface-1:#F1EFE8}
body{margin:0;padding:24px;background:#FAFAF8;font-family:var(--font-sans)}h1{font-size:18px;font-weight:500;margin:0 0 4px}p.d{margin:0 0 16px;color:#5F5E5A;font-size:14px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}</style></head><body>
<h1>Karoo style, all five watts options</h1><p class="d">Plex Sans Condensed, uppercase labels with green icons, Karoo green, no tile backgrounds, today's sizes, blue skip button. Not approved yet.</p>
<style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500&family=IBM+Plex+Sans:wght@400;700&display=swap');</style>
<div id="row" style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center;padding:1rem;background:var(--surface-1);border-radius:12px"></div>
<script>
const T={light:{bg:'#ffffff',tx:'#0b0b0b',sec:'#444441',trk:'#e3e1da',accent:'#129A5E',chartgrid:'#dddddd',prev:'#d3d1c7',inR:'#27500A',tint:'#C0DD97'},
dark:{bg:'#000000',tx:'#ffffff',sec:'#d3d1c7',trk:'#3a3a38',accent:'#1DB872',chartgrid:'#2c2c2c',prev:'#444441',inR:'#97C459',tint:'#27500A'}};
const SW=34,A0=160,A1=20,cx=240,cy=348,R=192;
const pt=(a,r)=>[cx+r*Math.cos(a*Math.PI/180),cy-r*Math.sin(a*Math.PI/180)];
const arc=(a,b,r)=>{const [x0,y0]=pt(a,r),[x1,y1]=pt(b,r);return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`};
const PLEX="'IBM Plex Sans',sans-serif", C="'IBM Plex Sans Condensed',sans-serif";
const heartP='M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z';
const t=(x,y,s,col,txt,anchor='start')=>`<text x="${x}" y="${y}" text-anchor="${anchor}" font-family="${C}" font-weight="500" font-size="${s}" fill="${col}">${txt}</text>`;
function lap(x,y,col){return `<g transform="translate(${x} ${y}) scale(0.85)"><path d="M11 -3 A11 11 0 1 1 5 -9.7" fill="none" stroke="${col}" stroke-width="3.4" stroke-linecap="round"/><path d="M1 -15 L10 -11 L3 -4 Z" fill="${col}"/></g>`}
function bolt(x,y,col){return `<path transform="translate(${x-7} ${y-11}) scale(0.85)" d="M10 0 L1 15 H8 L6 26 L15 10 H8 Z" fill="${col}"/>`}
function heart(x,y,col,s=1){return `<path transform="translate(${x-12*s} ${y-12*s}) scale(${s})" d="${heartP}" fill="none" stroke="${col}" stroke-width="${2.4/s}"/>`}
function target(x,y,col){return `<g fill="none" stroke="${col}" stroke-width="2.4"><circle cx="${x}" cy="${y}" r="9"/><circle cx="${x}" cy="${y}" r="4"/></g>`}
function timer(x,y,col){return `<g fill="none" stroke="${col}" stroke-width="2.4" stroke-linecap="round"><circle cx="${x}" cy="${y+2}" r="9"/><path d="M${x} ${y+2} V${y-3} M${x-4} ${y-11} H${x+4}"/></g>`}
function chart(c){const bars=[[60,'#1f9e75'],[95,'#c4821f'],[105,'#c4821f'],[118,'#d9582c'],[60,'#1f9e75'],[95,'#c4821f'],[105,'#c4821f'],[118,'#d9582c'],[60,'#1f9e75'],[95,'#c4821f'],[105,'#c4821f'],[118,'#d9582c'],[60,'#1f9e75'],[75,'#5e9a2a']];
 let bx=20,bh='';bars.forEach(([h,col],i)=>{bh+=`<rect x="${bx}" y="${760-h*0.5}" width="28" height="${h*0.5}" fill="${i==0?c.trk:col}"/>`;bx+=32});
 return `<line x1="16" y1="700" x2="464" y2="700" stroke="${c.chartgrid}"/><line x1="16" y1="730" x2="464" y2="730" stroke="${c.chartgrid}"/>${bh}<path d="M34 676 L34 768" stroke="${c.tx}" stroke-width="3"/><path d="M24 672 L44 672 L34 684 Z" fill="${c.tx}"/>`}
function btn(x,y,s,fill,fg,flip){return `<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="12" fill="${fill}"/><g transform="translate(${x+s/2} ${y+s/2}) scale(${(flip?-1:1)*s/68} ${s/68})"><path d="M-12 -18 L11 0 L-12 18 Z M17 -18 v36" fill="none" stroke="${fg}" stroke-width="3.5" stroke-linejoin="round"/></g>`}
function corners(c){return `<g fill="none" stroke="${c.sec}" stroke-width="4"><circle cx="32" cy="98" r="11"/><circle cx="32" cy="98" r="19" stroke-dasharray="7 5"/></g><rect x="438" y="84" width="7" height="28" rx="3" fill="${c.sec}"/><rect x="452" y="84" width="7" height="28" rx="3" fill="${c.sec}"/>`}
function status(c){return `<text x="460" y="48" text-anchor="end" font-family="${PLEX}" font-size="44" fill="${c.tx}">07:43</text>`}
// Interval row, progress, two cells, next up, chart: identical in every option
function lower(c){return `${timer(26,400,c.accent)}${t(44,408,20,c.tx,'INTERVAL 1 / 16')}${t(464,422,58,c.tx,'2:05','end')}
 <rect x="16" y="440" width="448" height="8" rx="4" fill="${c.trk}"/><rect x="16" y="440" width="250" height="8" rx="4" fill="${c.tx}"/>`}
function cells(c,right){return `${lap(18,484,c.accent)}${bolt(48,484,c.accent)}${t(228,492,20,c.tx,'LAP AVG','end')}${t(228,548,44,c.tx,'304','end')}
 <line x1="240" y1="470" x2="240" y2="556" stroke="${c.trk}" stroke-width="2"/>${right}`}
function next(c){return btn(16,588,60,c.prev,c.tx,true)+`${t(240,606,18,c.sec,'NEXT UP','middle')}${t(240,642,32,c.tx,'1m @ 181W','middle')}`+btn(404,588,60,'#85B7EB','#042C53',false)+chart(c)}
function classic(c,w,mode){const col=(mode=='text'||mode=='both')?c.inR:c.tx; const tint=(mode=='bg'||mode=='both');
 return `<rect width="480" height="800" fill="${c.bg}"/>${tint?`<rect x="0" y="60" width="480" height="510" fill="${c.tint}"/><rect x="0" y="540" width="480" height="30" fill="${c.bg}" opacity="0.6"/>`:''}${status(c)}${corners(c)}
 ${heart(196,96,c.tx,0.9)}${t(214,110,36,c.tx,'137')}
 ${t(240,330,250,col,w,'middle')}`+lower(c)+cells(c,`${target(266,484,c.accent)}${t(464,492,20,c.tx,'TARGET RANGE','end')}${t(464,548,44,c.tx,'293–308','end')}`)+next(c)}
function gauge(c,w){const lo=293,hi=308,tgt=300.5,half=Math.max(tgt*0.1,(hi-lo)/2*4),min=tgt-half,max=tgt+half;
 const ang=v=>A0-(Math.min(max,Math.max(min,v))-min)/(max-min)*(A0-A1);
 const [nx0,ny0]=pt(ang(w),R-SW/2-6),[nx1,ny1]=pt(ang(w),R+SW/2+6);
 return `<rect width="480" height="800" fill="${c.bg}"/>${status(c)}${corners(c)}
 ${target(200,78,c.accent)}${t(216,86,20,c.tx,'TARGET')}${t(240,120,34,c.tx,'293 – 308','middle')}
 <path d="${arc(A0,A1,R)}" fill="none" stroke="${c.trk}" stroke-width="${SW}" stroke-linecap="round"/><path d="${arc(ang(lo),ang(hi),R)}" fill="none" stroke="${c.accent}" stroke-width="${SW}" stroke-linecap="round"/>
 <line x1="${nx0}" y1="${ny0}" x2="${nx1}" y2="${ny1}" stroke="${c.bg}" stroke-width="18" stroke-linecap="round"/><line x1="${nx0}" y1="${ny0}" x2="${nx1}" y2="${ny1}" stroke="${c.tx}" stroke-width="10" stroke-linecap="round"/>
 ${t(240,340,155,c.tx,w,'middle')}`+lower(c)+cells(c,`${heart(266,484,c.tx,0.85)}${t(464,492,20,c.tx,'HR','end')}${t(464,548,44,c.tx,'137','end')}`)+next(c)}
function phone(svg,label){return `<div style="text-align:center"><svg viewBox="0 0 480 800" width="210" style="border-radius:20px;display:block;border:5px solid #222" role="img"><title>${label}</title>${svg}</svg><div style="font-size:13px;color:var(--text-secondary);margin-top:8px">${label}</div></div>`}
function draw(){document.getElementById('row').innerHTML=
 phone(classic(T.light,300,'plain'),'1 Plain')+phone(classic(T.light,300,'text'),'2 Coloured number')+phone(classic(T.light,300,'both'),'4 Both (3 = tint only)')+phone(gauge(T.light,310),'5 Gauge')+phone(classic(T.dark,300,'plain'),'1 Plain, dark')+phone(gauge(T.dark,290),'5 Gauge, dark')}
draw(); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
</script>

</body></html>
