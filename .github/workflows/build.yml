name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/*.apk interval-screen-stride.apk
      - uses: actions/upload-artifact@v4
        with:
          name: interval-screen-stride
          path: interval-screen-stride.apk
