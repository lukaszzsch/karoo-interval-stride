name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease
          cp "$(find . -path "*outputs/apk/release/*.apk" | head -1)" interval-screen-stride.apk
      - uses: actions/upload-artifact@v4
        with:
          name: interval-screen-stride
          path: interval-screen-stride.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" interval-screen-stride.apk \
            --title "Interval Screen Stride (build ${{ github.run_number }})" \
            --notes "Interval Screen for Karoo 3 with workouts from Stride. Share the .apk link to the Hammerhead Companion app to install." \
            --latest
